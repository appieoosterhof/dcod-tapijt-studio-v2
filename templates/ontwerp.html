<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DCOD Dessinator™ — een verhaal, verteld in uw vloer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Nunito+Sans:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#101413; --diep:#0B0F0E; --canvas:#171E1C; --card:#1E2724; --card-hi:#26312D;
  --green:#A7C58E; --green-dim:#7f9a66; --roze:#C7A2A9; --grijsgroen:#D5E0DF;
  --text:#C7CFCB; --text-strong:#F3F7F4; --muted:#8A968F; --faint:#5f6b66;
  --line:rgba(167,197,142,.10); --line-strong:rgba(167,197,142,.20);
  --radius:18px; --radius-sm:11px;
  --font:"Avenir Next","Avenir","Nunito Sans","Segoe UI",system-ui,sans-serif;
  --serif:"Cormorant Garamond",Georgia,serif;
  --t-snel:.16s; --t-midden:.5s; --t-traag:1.1s;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.55;min-height:100vh;overflow-x:hidden;}
a{color:var(--green);text-decoration:none;}
button{font-family:var(--font);cursor:pointer;border:none;font-size:14px;}
button:disabled{opacity:.4;cursor:default;}

/* ── Atmosfeer (decoratief, mood-verschuivend; geen foto vereist — echte
      beelden kunnen later als background-image worden ingedropt) ───────────── */
.sfeer{position:fixed;inset:0;z-index:-1;transition:background var(--t-traag) ease;
  background:
    radial-gradient(120% 90% at 78% 12%, rgba(167,197,142,.10), transparent 60%),
    radial-gradient(100% 80% at 20% 88%, rgba(199,162,169,.08), transparent 55%),
    linear-gradient(160deg, #0d1211, #131b18 60%, #0c100f);}
body[data-sfeer="warm"] .sfeer{background:
    radial-gradient(120% 90% at 78% 12%, rgba(214,168,120,.14), transparent 60%),
    radial-gradient(100% 80% at 20% 88%, rgba(199,162,169,.10), transparent 55%),
    linear-gradient(160deg,#120f0c,#1a1512 60%,#0f0c0a);}
body[data-sfeer="rustig"] .sfeer{background:
    radial-gradient(120% 90% at 78% 12%, rgba(167,197,142,.12), transparent 60%),
    radial-gradient(100% 80% at 20% 88%, rgba(150,180,175,.08), transparent 55%),
    linear-gradient(160deg,#0d1211,#121a18 60%,#0b0f0e);}
body[data-sfeer="grafisch"] .sfeer{background:
    radial-gradient(120% 90% at 80% 10%, rgba(210,220,225,.10), transparent 58%),
    radial-gradient(100% 80% at 18% 90%, rgba(120,150,140,.08), transparent 55%),
    linear-gradient(160deg,#0c100f,#141a1a 60%,#0a0d0d);}
body[data-sfeer="organisch"] .sfeer{background:
    radial-gradient(120% 90% at 76% 14%, rgba(167,197,142,.13), transparent 60%),
    radial-gradient(110% 80% at 22% 86%, rgba(190,170,130,.09), transparent 55%),
    linear-gradient(160deg,#0e1210,#161d18 60%,#0c100e);}

/* ── Hero (landingstoestand) ────────────────────────────────────────────────── */
#hero{position:fixed;inset:0;z-index:20;overflow-y:auto;
  transition:opacity var(--t-traag) ease, transform var(--t-traag) ease;}
.hero-inner{min-height:100%;width:100%;max-width:1120px;margin:0 auto;position:relative;z-index:2;
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
  padding:clamp(28px,6vh,56px) clamp(18px,4vw,40px);}
body.gestart #hero{opacity:0;transform:scale(1.03);pointer-events:none;}

/* Hero-tekst: rustig en ruim, uitsluitend Avenir-gewichten (huisstijl) */
.hero-kop{font-family:var(--font);font-weight:300;letter-spacing:.2px;color:var(--text-strong);
  font-size:clamp(31px,5.2vw,58px);line-height:1.5;}
.hero-kop span{display:block;}
.hero-kop .accent{font-weight:400;}

/* Themakaarten: bestaande projectfoto's, klikbaar; de fotografie leidend */
.hero-kaarten{margin-top:clamp(34px,6vh,64px);width:100%;display:grid;
  grid-template-columns:repeat(4,1fr);gap:clamp(12px,1.4vw,18px);}
.themakaart{position:relative;aspect-ratio:3/4;border-radius:var(--radius-sm);overflow:hidden;
  background:var(--diep) center/cover no-repeat;background-image:var(--kaart-beeld);
  border:1px solid rgba(255,255,255,.07);padding:0;text-align:left;
  transition:transform .5s ease,box-shadow .5s ease;}
.themakaart::after{content:"";position:absolute;inset:0;pointer-events:none;transition:background .5s ease;
  background:linear-gradient(180deg,rgba(9,12,11,.10) 0%,rgba(9,12,11,.22) 46%,rgba(9,12,11,.82) 100%);}
.themakaart:hover,.themakaart:focus-visible{transform:translateY(-5px);box-shadow:0 16px 44px rgba(0,0,0,.42);outline:none;}
.themakaart:hover::after,.themakaart:focus-visible::after{
  background:linear-gradient(180deg,rgba(9,12,11,.04) 0%,rgba(9,12,11,.14) 46%,rgba(9,12,11,.70) 100%);}
.kaart-thema{position:absolute;left:16px;right:14px;bottom:15px;z-index:1;
  font-family:var(--font);font-weight:600;font-size:clamp(14.5px,1.15vw,16px);line-height:1.3;
  color:#fff;letter-spacing:.2px;text-shadow:0 1px 5px rgba(0,0,0,.35);}

/* Secundaire, vrije ingang */
.hero-of{margin-top:clamp(30px,5vh,52px);color:var(--muted);font-size:14px;letter-spacing:.3px;}
.hero-invoer-wrap{margin-top:14px;display:flex;align-items:flex-end;gap:12px;justify-content:center;width:100%;}
#heroInvoer{width:min(560px,86vw);background:transparent;border:none;border-bottom:1px solid var(--line-strong);
  color:var(--text-strong);font-family:var(--font);font-size:17px;padding:12px 4px;resize:none;text-align:center;line-height:1.5;}
#heroInvoer::placeholder{color:var(--faint);}
#heroInvoer:focus{outline:none;border-color:var(--green-dim);}
.rond{width:46px;height:46px;border-radius:50%;background:var(--green);color:#16211a;font-size:20px;flex:none;
  display:flex;align-items:center;justify-content:center;transition:transform var(--t-snel) ease,opacity var(--t-snel) ease;}
.rond:hover{transform:translateY(-1px);}

/* Responsive: tablet & smartphone -> 2 kolommen, grotere/leesbare kaarttitels */
@media (max-width:820px){.hero-kaarten{grid-template-columns:repeat(2,1fr);}}
@media (max-width:520px){
  .hero-kop{font-size:clamp(29px,7.6vw,40px);line-height:1.45;}
  .hero-kaarten{gap:12px;margin-top:30px;}
  .themakaart{aspect-ratio:4/5;}
  .kaart-thema{font-size:16px;left:13px;right:12px;bottom:12px;}
}

/* ── Atelier ────────────────────────────────────────────────────────────────── */
header#atelierkop{display:flex;align-items:center;padding:22px 30px;opacity:0;transition:opacity var(--t-traag) ease;}
body.gestart header#atelierkop{opacity:1;}
.merk{font-family:var(--serif);font-size:20px;color:var(--text-strong);letter-spacing:.4px;}
.merk span{color:var(--green-dim);font-size:12px;vertical-align:super;}
.spacer{flex:1;}
button.stil{background:transparent;color:var(--muted);font-size:13px;padding:6px 4px;}
button.stil:hover{color:var(--text);}

main{opacity:0;transition:opacity var(--t-traag) ease;display:grid;
  grid-template-columns:minmax(340px,.82fr) minmax(420px,1.18fr);gap:34px;
  padding:6px 34px 60px;max-width:1360px;margin:0 auto;}
body.gestart main{opacity:1;}
@media (max-width:920px){ main{grid-template-columns:1fr;gap:22px;} }

/* voortgang -> atelier-fluistering (geen teller) */
#voortgang{display:flex;align-items:center;gap:12px;margin-bottom:20px;min-height:16px;}
.dot-reeks{display:flex;gap:6px;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--faint);transition:background var(--t-midden) ease;}
.dot.klaar{background:var(--green-dim);}
.dot.nu{background:var(--green);box-shadow:0 0 0 3px rgba(167,197,142,.14);}
.hoofdstuk-tekst{font-family:var(--serif);font-size:16px;color:var(--muted);font-style:italic;}

/* gesprek (ontwerptafel, geen chat-app) */
#gesprek{display:flex;flex-direction:column;gap:14px;margin-bottom:16px;max-height:46vh;overflow-y:auto;padding-right:4px;}
.bericht{font-size:15px;max-width:92%;}
.bericht.dessinator{color:var(--text-strong);font-size:16.5px;line-height:1.6;}
.bericht.gebruiker{align-self:flex-end;color:var(--muted);font-size:14px;background:var(--card);padding:9px 13px;border-radius:13px 13px 3px 13px;}
.bezig{color:var(--faint);font-style:italic;font-size:14px;}
#invoerrij{display:flex;align-items:flex-end;gap:10px;}
#invoer{flex:1;background:transparent;border:none;border-bottom:1px solid var(--line);color:var(--text-strong);
  font-family:var(--font);font-size:15px;padding:9px 2px;resize:none;line-height:1.5;}
#invoer::placeholder{color:var(--faint);}
#invoer:focus{outline:none;border-color:var(--green-dim);}
.rond.klein{width:38px;height:38px;font-size:17px;}

/* kaarten / keuzes (een knik, geen dialoogvenster) */
#actie:not(:empty){margin-top:18px;}
.kaart{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:16px 17px;}
.kaart h3{font-family:var(--serif);font-size:18px;color:var(--text-strong);margin-bottom:6px;font-weight:400;}
.kaart p{font-size:13.5px;color:var(--muted);margin-bottom:12px;}
.kaart .acties{display:flex;gap:10px;flex-wrap:wrap;}
.knik{background:var(--green);color:#16211a;border-radius:22px;padding:10px 18px;font-weight:600;transition:transform var(--t-snel) ease;}
.knik:hover{transform:translateY(-1px);}
.keuzes{display:flex;flex-direction:column;gap:9px;}
.keuze{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:12px 14px;color:var(--text);font-weight:400;transition:border-color var(--t-snel) ease,transform var(--t-snel) ease;}
.keuze:hover{border-color:var(--green-dim);transform:translateY(-1px);}

#melding{margin-top:12px;font-size:13.5px;color:var(--roze);min-height:18px;font-style:italic;}

/* samenvatting (stille notities terzijde) */
#samenvatting{margin-top:26px;}
#samenvatting.stil dl{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:13px;opacity:.82;}
#samenvatting dt{color:var(--faint);font-variant:small-caps;letter-spacing:.4px;}
#samenvatting dd{color:var(--grijsgroen);}

/* beeldwand (presentatiebord) */
.beeldwand{position:sticky;top:18px;align-self:start;}
#viz{min-height:52vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,var(--canvas),var(--diep));border:1px solid var(--line);
  border-radius:var(--radius);overflow:hidden;position:relative;box-shadow:0 30px 70px -40px rgba(0,0,0,.7);}
#viz img{max-width:100%;max-height:70vh;display:block;}
.stalen{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;padding:26px;}
.staal{width:58px;height:58px;border-radius:10px;border:1px solid var(--line-strong);box-shadow:0 6px 16px -8px rgba(0,0,0,.6);}
.leeg{color:var(--faint);font-size:14px;padding:40px;text-align:center;font-style:italic;}
.mockup{position:relative;width:100%;}
.mockup .achtergrond{width:100%;display:block;}
.mockup .dessin-overlay{position:absolute;inset:0;background-size:22% auto;background-repeat:repeat;opacity:0;transition:opacity var(--t-traag) ease;}
.mockup.gelegd .dessin-overlay{opacity:.92;}
#ruimte:not(:empty){margin-top:14px;}
#ruimte .kaart{background:var(--panel,var(--card));}

/* eindscherm */
#eind{display:none;margin-top:18px;}
#eind.zichtbaar{display:block;}
#eindinhoud{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:20px;}
#eindinhoud .titel{font-family:var(--serif);font-size:20px;color:var(--text-strong);margin-bottom:8px;}

/* onthul-animatie (alleen gewijzigde secties) */
@keyframes onthul{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@keyframes onthulBeeld{from{opacity:0;transform:scale(.985);}to{opacity:1;transform:scale(1);}}
.onthul{animation:onthul var(--t-midden) ease-out;}
#viz.onthul{animation:onthulBeeld var(--t-traag) ease-out;}
.bericht.nieuw{animation:onthul var(--t-midden) ease-out;}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important;}
  body.gestart #hero{display:none;}
}
</style>
</head>
<body>
<div class="sfeer" aria-hidden="true"></div>

<!-- Hero: de eerste indruk — vier werelden als vertrekpunt van een ontwerpgesprek -->
<div id="hero">
  <div class="hero-inner">
    <h1 class="hero-kop">
      <span>Elk thema.</span>
      <span>Elke ruimte.</span>
      <span class="accent">Elk ontwerp verdient een verhaal.</span>
    </h1>
    <!-- Themakaarten: eigen projectfoto's; klik = start het gesprek met dit thema als eerste context -->
    <div class="hero-kaarten">
      <button type="button" class="themakaart" data-thema="Ik ontwerp een vloer voor een werkplek- of kantooromgeving." style="--kaart-beeld:url('/static/img/projecten/project_3.jpg')">
        <span class="kaart-thema">Werkplekken &amp; Kantoren</span>
      </button>
      <button type="button" class="themakaart" data-thema="Ik ontwerp een vloer voor een hotel- of leisure-omgeving." style="--kaart-beeld:url('/static/img/projecten/project_2.jpg')">
        <span class="kaart-thema">Hotels &amp; Leisure</span>
      </button>
      <button type="button" class="themakaart" data-thema="Ik ontwerp een vloer voor een overheids- of publiek gebouw." style="--kaart-beeld:url('/static/img/projecten/project_1.jpg')">
        <span class="kaart-thema">Overheid &amp; Publieke Gebouwen</span>
      </button>
      <button type="button" class="themakaart" data-thema="Ik ontwerp een vloer voor een museum of bibliotheek." style="--kaart-beeld:url('/static/img/projecten/project_4.jpg')">
        <span class="kaart-thema">Musea &amp; Bibliotheken</span>
      </button>
    </div>
    <p class="hero-of">of vertel het in uw eigen woorden</p>
    <div class="hero-invoer-wrap">
      <textarea id="heroInvoer" rows="1" placeholder="Waar droomt deze ruimte van?"></textarea>
      <button id="heroVerstuur" class="rond" aria-label="Begin">→</button>
    </div>
  </div>
</div>

<header id="atelierkop">
  <div class="merk">DCOD Dessinator<span>™</span></div>
  <div class="spacer"></div>
  <button class="stil" id="nieuwGesprek">Opnieuw beginnen</button>
</header>

<main>
  <!-- Werkbank: gesprek & notities -->
  <section class="werkbank">
    <div id="voortgang"></div>
    <div id="gesprek"></div>
    <div id="invoerrij">
      <textarea id="invoer" rows="1" placeholder="Typ hier gerust verder…"></textarea>
      <button id="verstuur" class="rond klein" aria-label="Stuur">→</button>
    </div>
    <div id="actie"></div>
    <div id="melding"></div>
    <div id="samenvatting" class="stil"></div>
  </section>

  <!-- Beeldwand: presentatiebord -->
  <section class="beeldwand">
    <div id="viz"><div class="leeg">Zodra we samen een richting kiezen, verschijnt hier uw vloer.</div></div>
    <div id="ruimte"></div>
    <div id="eind"><div id="eindinhoud"></div></div>
  </section>
</main>

<!-- Themakaart-klik: start het gesprek met dit thema als eerste context (hergebruikt de bestaande start-flow) -->
<script>
(function(){
  var kaarten = document.querySelectorAll('.themakaart');
  var invoer = document.getElementById('heroInvoer');
  var verstuur = document.getElementById('heroVerstuur');
  if (!kaarten.length || !invoer || !verstuur) return;
  for (var i = 0; i < kaarten.length; i++) {
    kaarten[i].addEventListener('click', function () {
      var thema = this.getAttribute('data-thema');
      if (!thema) return;
      invoer.value = thema;      // gekozen wereld = eerste ontwerpcontext (vrij bij te sturen)
      verstuur.click();          // hergebruikt beginMetHero uit ontwerp.js; geen backend-wijziging
    });
  }
})();
</script>
<script src="/static/js/ontwerp.js?v=20260712_030000"></script>
</body>
</html>
